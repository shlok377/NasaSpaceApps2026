<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{--page:#f3f5fa;--ink:#1b2638;--ink-2:#56667f;--ink-3:#8796ab;--line:rgba(28,44,74,.10);--card:#ffffff;--accent:#2f5be0;
    --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
  .wrap{width:100%;display:grid;gap:14px;justify-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,34,60,.05),0 12px 32px rgba(20,34,60,.08);overflow:hidden}
  .head{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0;font-family:var(--f-display)}
  .head .n{font-weight:800;font-size:15px}
  .head .k{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .stage{position:relative;width:100%;background:transparent}
  .stage canvas{display:block}
  .means{padding:10px 18px 16px;font-size:14px;color:var(--ink-2);line-height:1.45}
  .means b{color:var(--ink)}
  .hero{width:min(1100px,100%)}
  .hero .stage{margin:12px 0 0}
  .cardsize{width:min(520px,100%)}
  .cardsize .stage{margin-top:12px}
  .minisize{width:min(360px,100%)}
  .minisize .stage{width:220px;margin:12px auto 0}
  .foot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3)}
  .foot button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
  .foot button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
  .foot .themes{display:inline-flex;gap:4px;padding-left:8px;border-left:1px solid var(--line)}
  .foot .swatches{display:inline-flex;gap:6px;align-items:center;padding-left:10px;border-left:1px solid var(--line)}
  .foot .swatches button{width:18px;height:18px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .foot .swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
  .foot .read{min-width:12ch;font-variant-numeric:tabular-nums}
  .foot .read b{color:var(--ink-2);font-weight:600}
  .err{color:#d24b42;font-size:13px;padding:12px 18px}
  html.embed,body.embed{background:transparent}
  body.embed{padding:0;display:block;min-height:0}
  body.embed .wrap{gap:0}
  body.embed .card{width:100%;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0}
  body.embed .head,body.embed .means,body.embed .foot{display:none}
  body.embed .stage{margin:0;width:100%}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>

/* ============================================================================
   Diorama kernel · one global `Diorama`, no dependency: it draws SVG.

   A diorama is a small world built from blocks (boxes, cylinders, balls,
   cones) on a rounded base, seen through an orthographic isometric camera,
   in a theme. The kernel fakes the 3D the way an illustrator does: every
   solid is projected to the page, its faces are painted flat in a tone
   that depends on where they face, the pieces are painted from the back
   of the scene to the front, the shadows are the solids' outlines thrown
   onto the ground, and the ink, when a theme asks for it, is drawn over
   the top. No WebGL, no three.js, no canvas: a `<svg>` the page can style.
   The kernel gives a figure everything that is the same from one diorama
   to the next: the stage, the camera, the light, the shadows, the fit, the
   loop, the pointer, the themes, the primitives and a few props. The
   figure gives the scene and its motion.

   INDEX · what a figure may call. Do not read below the hash line.

   Diorama.figure(spec)       declare a figure; spec is:
     name      lowercase-hyphen, the file and page name
     size      'hero' | 'card' | 'mini'            (frame and detail budget)
     means     one sentence, ≤140 chars, shown under the stage
     hint      one line, ≤90 chars: what the pointer does ("Hover the boat or the lighthouse"), shown with means
     theme     'toy' (default) | 'soft' | 'mono' | 'line' | 'night' | 'print',
               or { base: 'mono', …overrides } with any of the theme fields:
                 bg          css colour | 'transparent'
                 palette     { …overrides of Diorama.PAL } (also spec.palette)
                 accent      the subject's colour in every theme, and the one colour mono and line keep (default
                             pal.coral). Paint the thing that matters with pal.accent and nothing else with it: a
                             brand hex goes here and nowhere else, and the bench's swatches recolour the subject live.
                             In mono and line a surface keeps it only when its colour is exactly this hex
                 accentFill  0..1 how much of the accent fills an accented surface in line (default .1: a tinted
                             fill inside an accent outline); raise it for a solid brand shape
                 lights      { hemi: [sky, ground, i], sun: [colour, i], fill: [colour, i] | null, ambient: [colour, i] }
                 shadows     true | false: the solids throw their outlines on the ground
                 shadow      0..1 how dark the thrown shadows are (toy .2)
                 tones       [top, lit side, dark side] → every box face takes one of three flat tones instead of the
                             lights (print); round solids keep their bands
                 tone        { paper, ink } → every colour becomes a tint between them (mono), except the accent
                 tint        0..1 how much of the original colour survives the tone (mono: 0, default)
                 edges       true → ink lines on the edges of solids (line, print)
                 stroke      the line colour; strokeWidth in css px (default 1.1)
                 glow        multiplier on emissive (night: 2.6, line: 0)
                 halo        0..1 opacity of the soft shadow the base throws on the page (toy .3, line .16, night .6;
                             0: none). It is what makes the diorama a thing on a table rather than a cut-out
                 wobble      css px of hand tremor on the ink (default 0; 1.2 is a pen, 2.5 a felt tip). Edges bow
                             and overshoot a little at the corners, like a figure drawn by hand. Only where the
                             theme draws ink (line, print, or edges on another theme)
     camera    { az: 45, el: 35.264, pad: 1.08 }    optional, degrees
     tilt      degrees the camera drifts toward the pointer, default 4 (0: none)
     still     seconds into the loop for the reduced-motion frame, default 2
     build({ D, world, pal, ctx, M })  build the scene once; return parts (any object);
                                    parts.hot = [groups the pointer may pick]; give each a .name ('boat'),
                                    the page shows it as a read-out while the pointer is on it
     tick(ctx)                      per frame; ctx.t, ctx.dt, ctx.parts, ctx.pointer, ctx.hover, ctx.pressed,
                                    ctx.active. Set ctx.read = 'truck · at the dock' (≤ 40 chars) to tell the page
                                    what the scene is doing: it shows it as the read-out when the pointer is on nothing

   Diorama.mount(fig, { el, theme, reduced, still })  mount into an element; returns ctx:
     ctx.t ctx.dt         seconds; dt is 0 on the still frame
     ctx.pointer          { x, y (−1..1), inside, down, world: Vector3|null on the ground plane }
     ctx.hover            the group under the pointer among parts.hot, or null
     ctx.pressed          the hot group under the last press (a click or a tap), or null; ctx.pressedAt its second
     ctx.active           the hot group switched on by a press, until it is pressed again or another is pressed, or
                          null: a switch. A press is how touch answers, so give a card or a hero one thing to press
     ctx.read             a line the figure writes in tick, shown as the read-out (see tick)
     ctx.tap(x, y)        press at (x, y) in −1..1, as a visitor would (the look script does)
     ctx.theme ctx.pal    the resolved theme and palette
     ctx.svg ctx.world    the drawing and the scene's root group
     ctx.fit()            refit the camera to the world (call after adding big things)
     ctx.render()         draw one frame
     ctx.step(dt)         advance the clock by hand (the look script does; a figure never needs to)
     ctx.start() ctx.stop() ctx.stillFrame()
     ctx.destroy()        stop everything, remove the drawing

   M (the maths, also Diorama.M and D.M): Vector3 (set, copy, clone, add, sub, multiplyScalar, dot, cross,
     length, normalize, lerp, applyMatrix4, transformDirection), Matrix4, Color. Every group and mesh has
     position, rotation { x, y, z }, scale, visible, name, userData, children, add(), traverse(),
     updateMatrixWorld(), localToWorld(v), getWorldPosition(v), as three.js had them.

   D (per mount toolkit, parent defaults to world):
     D.pal                           the palette in use: bg base ground grass asphalt line water sand ink steel slate mist
                                     paper cloud coral terracotta mustard sage teal plum rose cobalt cobaltSoft safety ok warn
                                     bad flame mint lilac sky wood cardboard skin leaf leafDark leafLight trunk tyre hub lampGlow,
                                     and accent; snow is ground or paper. Materials are cached and shared: clone one
                                     (D.mat(c).clone()) before changing it for a single object
     group.userData.terrain = true   ground other things stand on (a hill, a mountain): look's clash check skips it
     D.group(x, y, z, parent)        a Group placed at x, y, z
     D.box(w, h, d, c, x, y, z, parent, { shadow, mat, r, on })  on: the mesh this is set into the face of (a window
                                     in a wall, a door on a cabinet, a shelf inside a fridge): it paints right after it.
                                     Any mesh takes m.on = other
     D.rbox(w, h, d, c, x, y, z, parent, { r })  a box with rounded edges (drawn as a box; the rounding is the ink's)
     D.cyl(rt, rb, h, c, x, y, z, parent, seg)
     D.cone(r, h, c, x, y, z, parent, seg)
     D.ball(r, c, x, y, z, parent)
     D.dome(r, c, x, y, z, parent)   a half sphere, flat side down
     D.wedge(w, h, d, c, x, y, z, parent)  a gable (triangular prism along x)
     D.slab(w, d, c, x, y, z, parent, { h, r, side })  a rounded plate, the diorama base: c on top, side on the walls.
                                     Zones on it (grass, roads) are boxes that stay r inside its corners, or slabs of their own
     D.torus(r, tube, c, x, y, z, parent)
     D.wheel(r, w, c, x, y, z, parent)  a cylinder on its side, axle along z, so it rolls along x
     D.label(text, w, h, { color, bg, size, weight, font, rot })  a plane with text
     D.mat(c, opts)                  a cached material in the theme (opts: emissive, emissiveIntensity, transparent, opacity)
     props are built for the solid themes: in line, a bush or a rock is an outline with little inside; use a
     shape with flat faces (a box, a cylinder, a cone) when it has to read in line
     D.props.tree(x, z, parent, { r, kind: 'round' | 'pine' | 'tall', color, dark, light, trunk, yaw })
     D.props.bush(x, z, parent, { r, color, light })  three lobes
     D.props.rock(x, z, parent, { r, h, color, yaw })
     D.props.cloud(x, y, z, parent, { r, color })
     D.props.person(x, z, parent, { shirt, hat, skin, yaw })
     D.props.lamp(x, z, parent, { h })
     D.props.crate(x, y, z, parent, { w, h, d, color })
     D.props.pallet(x, y, z, parent, { h, color })  a wooden pallet with a load of height h (0: empty)
     D.props.cone(x, z, parent)      a traffic cone
     D.props.flag(x, z, parent, { h, color })  a pole and a flag; returns { group, pole, cloth }

   Motion (also on Diorama):
     D.clamp(v, a, b)  D.lerp(a, b, t)  D.smooth(t)  D.out(t)  D.inOut(t)
     D.phase(t, period, offset)      0..1 sawtooth
     D.wave(t, period, offset)       −1..1 sine
     D.pulse(t, period, width)       0..1, a bump once per period lasting width·period
     D.spring(k, c)                  { x, v, t, step(dt), set(x) } a damped follow
     D.apart(items, { k, c, stagger })  take a thing apart and put it back: items [{ g, x, y, z }, …], outermost first,
                                     each group moved by its vector times a sprung 0..1, one after another (stagger .06 s;
                                     closing runs the order backwards). { open(bool), step(dt), items }: in tick,
                                     a.open(ctx.hover === rocket); a.step(ctx.dt). Hover shows the inside of a thing
     D.path(points, closed, round)   polyline on the ground, points [[x, z], …], corners rounded by `round` (.5; 0 sharp): { length, at(dist) → { x, z, yaw } }
     D.place(group, path, dist)      put a group on a path, its local +x facing along it (build vehicles nose toward +x)
     D.spin(meshes, dist, r)         roll wheels by distance travelled
     D.stagger(i, from, step)        |i − from| · step
   ============================================================================ */
var Diorama = (function () {
  'use strict';
  var TAU = Math.PI * 2;
  var PAL = {
    bg: '#eceef2', base: '#e1e4ea', ground: '#f4f5f7', grass: '#cfe5cd', asphalt: '#cdd3db', line: '#ffffff', water: '#b9dbe9', sand: '#f0dcb4',
    ink: '#1f2430', steel: '#434a58', slate: '#5e6675', mist: '#8b93a3', paper: '#f8f8f6', cloud: '#e6e7ea',
    coral: '#e8714f', terracotta: '#cf6a4c', mustard: '#e9b949', sage: '#8fbf9f', teal: '#4aa3a0', plum: '#8a6fb8', rose: '#ee8fa6',
    cobalt: '#3b63d8', cobaltSoft: '#e4eafb', safety: '#e9b949', ok: '#3f9f6f', warn: '#c98a1c', bad: '#d4544a',
    flame: '#e8714f', mint: '#5fbfb4', lilac: '#9a85d6', sky: '#bcd9ea',
    wood: '#c89a64', cardboard: '#dcb782', skin: '#f1c7a0', leaf: '#6fc38a', leafDark: '#4f9f6b', leafLight: '#9ad9a6', trunk: '#a07c5b',
    tyre: '#2b2f3a', hub: '#cfd4dc', lampGlow: '#ffe3a0'
  };
  var SIZES = { hero: { aspect: 3 / 2 }, card: { aspect: 4 / 3 }, mini: { aspect: 1 } };
  var THEMES = {
    toy: { bg: '#eceef2', shadows: true, shadow: .18, tint: 1, glow: 1, strokeWidth: 1.1, halo: .3, wobble: 0,
      lights: { hemi: ['#fff8ee', '#9fb0cc', .5], sun: ['#fff3dc', .62], fill: ['#c8dbff', .26], ambient: ['#e0e7f5', .1] } },
    soft: { bg: '#f5f1ea', palette: { base: '#e9e3d9', ground: '#f8f4ed', grass: '#d9e8d2', asphalt: '#ddd7cd', paper: '#fcfaf6', cloud: '#ece7df', water: '#cfe3ea', cobalt: '#6b80c9', safety: '#eac36a', mustard: '#eac36a', flame: '#e98a66', coral: '#e98a66', terracotta: '#d98468', ok: '#6fae8a', mint: '#86c6bd', teal: '#6fb3ae', lilac: '#ab9fd9', plum: '#a08fc6', leaf: '#93cf9e', leafDark: '#73b88a', leafLight: '#b4dfb9' },
      shadows: true, shadow: .14, tint: 1, glow: .8, strokeWidth: 1.1, halo: .24, wobble: 0,
      lights: { hemi: ['#fff9f0', '#cfc5b6', .58], sun: ['#ffe8c6', .46], fill: ['#e9e1ff', .2], ambient: ['#f1ece4', .14] } },
    mono: { bg: '#e9ebf1', tone: { paper: '#ffffff', ink: '#1b2638' }, tint: 0, shadows: true, shadow: .16, glow: .6, strokeWidth: 1.1, halo: .26, wobble: 0,
      lights: { hemi: ['#ffffff', '#b9c0cf', .5], sun: ['#ffffff', .62], fill: ['#dde3f0', .26], ambient: ['#e4e8f0', .1] } },
    line: { bg: '#ffffff', tone: { paper: '#ffffff', ink: '#ffffff' }, tint: 0, edges: true, shadows: false, shadow: 0, stroke: '#1b2638', strokeWidth: 1.1, glow: 0, halo: .16, wobble: 0,
      lights: { hemi: ['#ffffff', '#ffffff', 1], sun: ['#ffffff', 0], fill: null, ambient: ['#ffffff', 0] } },
    print: { bg: '#f6f4ef', palette: { base: '#e6e2d9', ground: '#f9f7f2', paper: '#fbfaf6', cloud: '#eceae3' }, tones: [1, .9, .76], shadows: false, shadow: 0, edges: true, stroke: '#2b2a2f', strokeWidth: .9,
      tint: 1, glow: .3, halo: .26, wobble: 0,
      lights: { hemi: ['#ffffff', '#ffffff', .92], sun: ['#ffffff', .14], fill: null, ambient: ['#ffffff', .04] } },
    night: { bg: '#131726', palette: { base: '#3b4359', ground: '#4b546c', grass: '#3a6353', asphalt: '#555f78', line: '#aab3c8', water: '#2f4f6e', sand: '#8c7a5a', paper: '#5a6480', cloud: '#6b7590', sky: '#ffd98a', ink: '#0d1018', steel: '#232a38', slate: '#343c4e', cobaltSoft: '#3a4a7a', lampGlow: '#ffe3a0', leaf: '#4fae78', leafDark: '#3b9262', leafLight: '#6cc48f' },
      shadows: true, shadow: .3, tint: 1, glow: 2.6, strokeWidth: 1.1, halo: .6, wobble: 0,
      lights: { hemi: ['#7d8fbf', '#1f2435', .85], sun: ['#ffd6a0', .55], fill: ['#4a6ac8', .5], ambient: ['#3a4566', .8] } }
  };
  var figures = [];

  /* ---------- small maths ---------- */
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var smooth = function (t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  var out = function (t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  var inOut = function (t) { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var phase = function (t, period, offset) { var p = (t / period + (offset || 0)) % 1; return p < 0 ? p + 1 : p; };
  var wave = function (t, period, offset) { return Math.sin(phase(t, period, offset) * TAU); };
  var pulse = function (t, period, width) { var p = phase(t, period); return p < width ? Math.sin(p / width * Math.PI) : 0; };
  var stagger = function (i, from, step) { return Math.abs(i - from) * step; };
  function spring(k, c) {
    var s = { x: 0, v: 0, t: 0, k: k || 90, c: c || 16 };
    s.step = function (dt) { var h = Math.min(dt, 1 / 30); var a = (s.t - s.x) * s.k - s.v * s.c; s.v += a * h; s.x += s.v * h; return s.x; };
    s.set = function (x) { s.x = s.t = x; s.v = 0; return s; };
    return s;
  }
  function apart(items, o) {
    /* a thing taken apart: every item's group moves along its vector by a sprung 0..1, the first item
       first and the rest one stagger later each; closing runs the order backwards, so the parts that
       left last come home first and nothing passes through anything on the way back */
    o = o || {};
    var A = { target: 0, age: 1e9, dir: 1, stagger: o.stagger == null ? .06 : o.stagger };
    A.items = items.map(function (it) { return { g: it.g, v: [it.x || 0, it.y || 0, it.z || 0], s: spring(o.k || 70, o.c || 15), b: [it.g.position.x, it.g.position.y, it.g.position.z] }; });
    A.open = function (on) { on = on ? 1 : 0; if (on !== A.target) { A.target = on; A.age = 0; A.dir = on ? 1 : -1; } return A; };
    A.step = function (dt) {
      A.age += dt;
      for (var k = 0, n = A.items.length; k < n; k++) {
        var it = A.items[k], rank = A.dir > 0 ? k : n - 1 - k;
        if (A.age >= rank * A.stagger) it.s.t = A.target;
        it.s.step(dt);
        it.g.position.set(it.b[0] + it.v[0] * it.s.x, it.b[1] + it.v[1] * it.s.x, it.b[2] + it.v[2] * it.s.x);
      }
      return A;
    };
    return A;
  }
  function path(points, closed, round) {
    /* a polyline on the ground with its corners rounded (arcs of radius `round`, .5 by default, 0 for sharp),
       so a vehicle turns instead of snapping; at(dist) gives the point and the heading there */
    var pts = points.map(function (p) { return { x: p[0], z: p[1] }; }), n = pts.length, R = round == null ? .5 : round;
    var seg = [], len = 0, i;
    function line(a, b) { var l = Math.hypot(b.x - a.x, b.z - a.z); if (l < 1e-6) return; seg.push({ a: a, b: b, l: l, s: len, yaw: Math.atan2(-(b.z - a.z), b.x - a.x) }); len += l; }
    function arc(c, r, a0, da) { var l = Math.abs(da) * r; if (l < 1e-6) return; seg.push({ c: c, r: r, a0: a0, da: da, l: l, s: len }); len += l; }
    var m = closed ? n : n - 2, cut = [];
    for (i = 0; i < n; i++) cut.push(0);
    var corners = [];
    for (i = 0; i < m; i++) {
      var k = closed ? (i + 1) % n : i + 1, P = pts[k], A = pts[(k - 1 + n) % n], B = pts[(k + 1) % n];
      var u1 = { x: P.x - A.x, z: P.z - A.z }, u2 = { x: B.x - P.x, z: B.z - P.z }, l1 = Math.hypot(u1.x, u1.z), l2 = Math.hypot(u2.x, u2.z);
      if (!l1 || !l2) continue;
      u1.x /= l1; u1.z /= l1; u2.x /= l2; u2.z /= l2;
      var cr = u1.x * u2.z - u1.z * u2.x, dot = clamp(u1.x * u2.x + u1.z * u2.z, -1, 1), th = Math.acos(dot);
      if (R <= 0 || th < .02 || th > Math.PI - .02) continue;
      var r = Math.min(R, .5 * Math.min(l1, l2) / Math.tan(th / 2)), t = r * Math.tan(th / 2), sgn = cr > 0 ? 1 : -1;
      var T1 = { x: P.x - u1.x * t, z: P.z - u1.z * t }, T2 = { x: P.x + u2.x * t, z: P.z + u2.z * t };
      var C = { x: T1.x - u1.z * sgn * r, z: T1.z + u1.x * sgn * r };
      corners[k] = { T1: T1, T2: T2, C: C, r: r, a0: Math.atan2(T1.z - C.z, T1.x - C.x), da: th * sgn };
      cut[k] = t;
    }
    var count = closed ? n : n - 1;
    for (i = 0; i < count; i++) {
      var a = pts[i], b = pts[(i + 1) % n], ca = corners[i], cb = corners[(i + 1) % n];
      if (i === 0 && closed && ca) arc(ca.C, ca.r, ca.a0, ca.da);
      line(ca ? ca.T2 : a, cb ? cb.T1 : b);
      if (cb && !(closed && (i + 1) % n === 0)) arc(cb.C, cb.r, cb.a0, cb.da);
    }
    return {
      length: len, closed: !!closed,
      at: function (d) {
        if (closed) { d = d % len; if (d < 0) d += len; } else d = clamp(d, 0, len);
        for (var i = 0; i < seg.length; i++) {

      D.box(.25, .015, 7.6, '#313a4e', -3.6, .015, 0, null, { shadow: false });
      D.box(6.8, .015, .25, '#313a4e', .2, .015, 2.6, null, { shadow: false });

      /* ---- 2. Structural Columns & Gantry Framework ---- */
      var columns = [[-5.6, -3.8], [5.6, -3.8], [-5.6, 3.8], [5.6, 3.8]];
      columns.forEach(function (c) {
        D.box(.34, 6.8, .34, pal.steel, c[0], 3.4, c[1]);
        D.box(.46, .4, .46, '#181d28', c[0], .2, c[1]);
      });

      // High gantry runway beams
      D.box(11.8, .35, .25, pal.steel, 0, 6.7, -3.8);
      D.box(11.8, .35, .25, pal.steel, 0, 6.7, 3.8);

      // Back wall framework with illuminated observation bay
      for (var k = -4; k <= 4; k += 2) {
        D.box(.12, 6.6, .12, pal.slate, k, 3.3, -4.2);
      }
      D.box(9.2, .14, .14, pal.slate, 0, 4.2, -4.2);
      // Glowing control room observation windows
      [-2.4, 0, 2.4].forEach(function (wx) {
        D.box(1.8, .9, .06, '#22c0e0', wx, 4.8, -4.22, { mat: { emissive: '#22c0e0', emissiveIntensity: 1.4 }, shadow: false });
      });

      /* ---- 3. Overhead Traveling Gantry Crane ---- */
      var craneBridge = D.group(0, 6.8, 0);
      craneBridge.name = 'gantry crane';
      hot.push(craneBridge);

      // Crane girder spanning between runway beams
      D.box(.48, .38, 7.8, '#d49b28', 0, 0, 0, craneBridge);
      D.box(.56, .2, 1.2, '#181d28', 0, .05, -3.8, craneBridge);
      D.box(.56, .2, 1.2, '#181d28', 0, .05, 3.8, craneBridge);

      // Traveling trolley
      var trolley = D.group(0, -.25, .8, craneBridge);
      D.box(.8, .35, .8, '#242a3a', 0, 0, 0, trolley);

      // Crane flashing warning beacon
      var craneBeacon = D.box(.16, .16, .14, '#ffd23f', 0, .26, 0, trolley, { mat: { emissive: '#ffd23f', emissiveIntensity: 2.2 }, shadow: false });

      // Hoist cables & suspended payload hook
      var cable = D.cyl(.018, .018, 2.8, pal.steel, 0, -1.5, 0, trolley, 6);
      var hook = D.group(0, -2.8, 0, trolley);
      D.box(.3, .2, .3, pal.steel, 0, 0, 0, hook);
      // Module being suspended/placed by the crane
      var liftedModule = D.cyl(.6, .6, 1.1, '#f4eee6', 0, -.65, 0, hook, 16);
      D.cyl(.62, .62, .15, '#ffa53d', 0, -.65, 0, hook, 16);

      /* ---- 4. Catwalk & Maintenance Platform ---- */
      D.box(1.5, .1, 4.8, pal.slate, -4.8, 3.2, 0);
      D.box(.06, .85, 4.8, pal.steel, -4.05, 3.65, 0);
      D.box(1.5, .85, .06, pal.steel, -4.8, 3.65, -2.4);
      D.box(1.5, .85, .06, pal.steel, -4.8, 3.65, 2.4);
      // Access ladder
      D.box(.08, 3.2, .4, pal.steel, -5.5, 1.6, 2.0);

      /* ---- 5. Multi-Stage Rocket Stack ---- */
      var rocket = D.group(0, .08, 0);
      rocket.name = 'rocket stack';
      hot.push(rocket);

      var s0 = D.group(0, 0, 0, rocket); // Booster base & engines
      var s1 = D.group(0, 0, 0, rocket); // Main core tank
      var s2 = D.group(0, 0, 0, rocket); // Upper stage tank
      var s3 = D.group(0, 0, 0, rocket); // Cockpit / Payload
      var s4 = D.group(0, 0, 0, rocket); // Aerodynamic nose cone

      // Stage 0: Booster Engine Section
      D.box(1.6, .9, 1.6, '#dfe1ec', 0, .45, 0, s0);
      D.cyl(.32, .52, .55, pal.steel, -.42, -.06, 0, s0, 14);
      D.cyl(.32, .52, .55, pal.steel, .42, -.06, 0, s0, 14);
      // Stabilizer fins
      var finL = D.wedge(.12, 1.1, .8, '#ff4f4f', -.92, .5, 0, s0);
      finL.rotation.z = -Math.PI / 2;
      var finR = D.wedge(.12, 1.1, .8, '#ff4f4f', .92, .5, 0, s0);
      finR.rotation.z = Math.PI / 2;
      // RCS thruster blocks
      D.box(.2, .2, .14, '#7aa6ff', -.86, .72, 0, s0);
      D.box(.2, .2, .14, '#7aa6ff', .86, .72, 0, s0);

      // Stage 1: Main Core Fuel Tank
      D.cyl(.72, .72, 2.2, '#f4eee6', 0, 2.0, 0, s1, 20);
      D.cyl(.74, .74, .14, '#ffa53d', 0, 1.1, 0, s1, 20);
      D.cyl(.74, .74, .14, '#ffa53d', 0, 2.9, 0, s1, 20);
      D.cyl(.74, .74, .16, pal.slate, 0, 3.12, 0, s1, 20);

      // Stage 2: Second Stage Fuel & Vacuum Engine
      D.cyl(.68, .68, 1.4, '#e6e7ea', 0, 3.9, 0, s2, 20);
      D.cyl(.70, .70, .12, '#ff4f4f', 0, 4.4, 0, s2, 20);

      // Stage 3: Command Module / Cockpit
      D.cyl(.65, .65, .95, '#f4eee6', 0, 5.08, 0, s3, 20);
      // Cyan visor cockpit window
      D.box(.56, .4, .12, '#22c0e0', 0, 5.12, .62, s3, { mat: { emissive: '#22c0e0', emissiveIntensity: 1.8 }, shadow: false });

      // Stage 4: Nose Cone
      D.cone(.65, 1.35, '#ff4f4f', 0, 6.22, 0, s4, 20);

      // Sprung stage explosion on hover
      var apart = D.apart([
        { g: s4, y: 3.4 },
        { g: s3, y: 2.3 },
        { g: s2, y: 1.4 },
        { g: s1, y: .65 }
      ], { stagger: .07, k: 85, c: 17 });

      /* ---- 6. Industrial Work Floodlights ---- */
      D.props.lamp(-3.8, -2.8, null, { h: 4.8 });
      D.props.lamp(3.8, 2.6, null, { h: 4.4 });

      /* ---- 7. Ground Diagnostic Station & Hardware Storage ---- */
      // Diagnostic Terminal
      var terminal = D.group(-3.4, 0, 1.8);
      D.box(1.6, .9, .7, '#242a3a', 0, .45, 0, terminal);
      D.box(.52, .36, .05, '#3ef08a', -.35, .92, .36, terminal, { mat: { emissive: '#3ef08a', emissiveIntensity: 1.8 }, shadow: false });
      D.box(.52, .36, .05, '#22c0e0', .35, .92, .36, terminal, { mat: { emissive: '#22c0e0', emissiveIntensity: 1.8 }, shadow: false });

      // Hardware pallets and crates
      D.props.pallet(-3.8, 0, -1.8, null, { h: .75, color: '#f0a02e' });
      D.props.crate(3.8, 0, -1.8, null, { w: .9, h: .8, d: .9, color: pal.steel });
      D.props.crate(3.8, 0, -.8, null, { w: .8, h: .6, d: .8, color: '#dcb782' });

      // Cryogenic pressure dewars
      D.ball(.65, '#e6e7ea', 3.8, .7, 1.2, null, 16);
      D.cyl(.5, .5, .2, pal.steel, 3.8, .1, 1.2, null, 12);
      D.ball(.52, '#d6d0b6', 3.0, .6, 1.9, null, 16);
      D.cyl(.4, .4, .18, pal.steel, 3.0, .09, 1.9, null, 12);

      // Safety perimeter cones around the pad
      [[-2.4, -2.4], [2.4, -2.4], [-2.4, 2.4], [2.4, 2.4]].forEach(function (p) {
        D.props.cone(p[0], p[1], null);
      });

      /* ---- 8. Technicians & Personnel ---- */
      var engineer = D.props.person(-1.8, 1.8, null, { shirt: '#ffa53d', hat: '#ffd23f', skin: pal.skin, yaw: -.45 });
      engineer.name = 'chief engineer';
      hot.push(engineer);

      var engPath = D.path([[-1.8, 1.8], [-2.8, 1.8], [-2.6, 1.2], [-1.8, 1.4]], true, .4);

      var catwalkTech = D.props.person(-4.6, 0, null, { shirt: '#3b63d8', hat: '#f8f8f6', yaw: 1.1 });
      catwalkTech.position.y = 3.25;

      /* ---- 9. Subtle Cryogenic Venting Steam ---- */
      var steam = [];
      for (var i = 0; i < 4; i++) {
        var v = D.ball(.18, '#cfd6e4', 0, 0, 0, null, 8);
        v.castShadow = false;
        steam.push(v);
      }

      return {
        hot: hot,
        rocket: rocket,
        apart: apart,
        craneBridge: craneBridge,
        craneBeacon: craneBeacon,
        hook: hook,
        cable: cable,
        engineer: engineer,
        engPath: engPath,
        steam: steam,
        craneSpring: D.spring(50, 12),
        craneActive: false,
        lastCranePress: -1,
        lastEngPress: -1
      };
    },

    tick: function (ctx) {
      var D = ctx.D, p = ctx.parts, t = ctx.t;

      /* Gantry Crane Bridge Motion & Click Interaction */
      if (ctx.pressed === p.craneBridge && ctx.pressedAt !== p.lastCranePress) {
        p.lastCranePress = ctx.pressedAt;
        p.craneActive = !p.craneActive;
      }

      var craneWave = D.wave(t, 18);
      p.craneBridge.position.x = craneWave * 2.2;

      // Crane hoist springs up/down when active
      p.craneSpring.t = p.craneActive ? 1.6 : 0;
      p.craneSpring.step(ctx.dt);
      p.hook.position.y = -2.8 + p.craneSpring.x;

      // Warning strobe on crane trolley
      p.craneBeacon.material.emissiveIntensity = D.phase(t, 1.0) < .5 ? 2.5 : .2;

      /* Staged Rocket Apart Spring on Hover */
      p.apart.open(ctx.hover === p.rocket || ctx.active === p.rocket);
      p.apart.step(ctx.dt);

      /* Engineer Pacing & Tap Wave Reaction */
      var engPressed = (ctx.pressed === p.engineer && t - ctx.pressedAt < 2.0);
      if (engPressed) {
        p.engineer.position.y = .18 * Math.abs(Math.sin((t - ctx.pressedAt) * 8));
        p.engineer.rotation.y = -.45 + .3 * Math.sin(t * 10);
      } else {
        p.engineer.position.y = 0;
        var W = D.phase(t, 14);
        var dist = W * p.engPath.length;
        D.place(p.engineer, p.engPath, dist);
      }

      /* Ambient Cryo Venting Vapour */
      p.steam.forEach(function (v, k) {
        var ph = D.phase(t, 2.2, k * .25);
        v.position.set(1.1 + .12 * D.wave(t, 1.4, k), 1.2 + ph * .9, .2 + .08 * D.wave(t, 1.1, k));
        var sz = Math.sin(ph * Math.PI) * .9;
        v.scale.setScalar(sz + .01);
      });

      /* Bay Telemetry Status Line for the HUD */
      if (ctx.hover === p.rocket) {
        ctx.read = 'ROCKET · INSPECTING STAGES';
      } else if (ctx.hover === p.craneBridge) {
        ctx.read = p.craneActive ? 'GANTRY CRANE · HOISTING PAYLOAD' : 'GANTRY CRANE · READY ON RUNWAY';
      } else if (ctx.hover === p.engineer) {
        ctx.read = engPressed ? 'CHIEF ENGINEER · SYSTEMS NOMINAL!' : 'CHIEF ENGINEER · REVIEWING CHECKLIST';
      } else {
        ctx.read = 'VAB BAY 01 · NIGHT PRE-FLIGHT CHECK';
      }
    }
  });
})();

</script>
<script>
(function () {
  var fig = Diorama.figures[Diorama.figures.length - 1];
  var wrap = document.getElementById('wrap');
  var q = new URLSearchParams(location.search);
  if (!fig) { wrap.innerHTML = '<div class="card cardsize"><div class="err">No figure declared: the page needs one Diorama.figure({ … }) call.</div></div>'; return; }
  document.title = fig.name + ' · Diorama';
  if (q.has('embed')) { document.body.classList.add('embed'); document.documentElement.classList.add('embed'); }
  var card = document.createElement('div');
  var stage = document.createElement('div'); stage.className = 'stage'; stage.id = 'stage';
  var means = fig.means || '';
  {
    card.className = 'card ' + (fig.size === 'hero' ? 'hero' : fig.size === 'mini' ? 'minisize' : 'cardsize');
    var head = document.createElement('div'); head.className = 'head';
    head.innerHTML = '<span class="n"></span><span class="k"></span>';
    head.querySelector('.n').textContent = fig.title || fig.name; head.querySelector('.k').textContent = fig.size || 'card';
    card.appendChild(head); card.appendChild(stage);
    var m = document.createElement('div'); m.className = 'means'; m.textContent = means + (fig.hint ? ' ' : ''); if (fig.hint) { var hb = document.createElement('b'); hb.textContent = fig.hint; m.appendChild(hb); } card.appendChild(m);
  }
  wrap.appendChild(card);
  var foot = document.createElement('div'); foot.className = 'foot';
  var still = document.createElement('button'); still.type = 'button'; still.textContent = 'Still frame'; still.setAttribute('aria-pressed', 'false');
  var note = document.createElement('span'); note.className = 'read'; note.setAttribute('aria-live', 'polite'); note.textContent = 'Move the pointer over the scene.';
  foot.appendChild(still); foot.appendChild(note); wrap.appendChild(foot);
  var ctx, figAccent = fig.theme && typeof fig.theme === 'object' ? fig.theme.accent : null;
  var figBase = typeof fig.theme === 'object' ? fig.theme.base || 'toy' : fig.theme || 'toy';
  /* a theme picked here swaps the look and keeps the figure's own accent, which is the brand's colour; a swatch
     (or ?accent=hex) recolours the subject, which every figure paints with pal.accent */
  var themePick = q.get('theme') || null, accentPick = q.get('accent') ? '#' + q.get('accent').replace(/^#/, '') : null;
  function picked() { var a = accentPick || figAccent; return themePick || accentPick ? (a ? { base: themePick || figBase, accent: a } : themePick) : undefined; }
  if (figAccent) document.documentElement.style.setProperty('--accent', figAccent);
  function mountIt(reduced) {
    if (ctx) ctx.destroy();
    try { ctx = Diorama.mount(fig, { el: stage, reduced: reduced, still: q.has('t') ? +q.get('t') : undefined, theme: picked() }); window.__diorama = ctx; }
    catch (err) { stage.innerHTML = '<div class="err">' + (err && err.message || err) + '</div>'; console.error(err); }
  }
  var themes = Object.keys(Diorama.THEMES), sel = document.createElement('span'); sel.className = 'themes';
  themes.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.dataset.theme = t;
    b.setAttribute('aria-pressed', String(t === (themePick || figBase)));
    b.addEventListener('click', function () { themePick = t; sel.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); mountIt(isStill); });
    sel.appendChild(b);
  });
  foot.insertBefore(sel, note);
  /* the swatches: the figure's own accent first, then five of the palette's */
  var own = figAccent || Diorama.PAL.coral, sw = document.createElement('span'); sw.className = 'swatches'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Accent');
  [['own', own], ['mustard', Diorama.PAL.mustard], ['mint', Diorama.PAL.mint], ['cobalt', Diorama.PAL.cobalt], ['rose', Diorama.PAL.rose], ['plum', Diorama.PAL.plum]].forEach(function (s) {
    if (s[0] !== 'own' && s[1].toLowerCase() === own.toLowerCase()) return;
    var b = document.createElement('button'); b.type = 'button'; b.style.background = s[1]; b.dataset.accent = s[1]; b.title = s[0] === 'own' ? 'the figure’s own accent' : s[0]; b.setAttribute('aria-label', 'Accent ' + s[0]);
    b.setAttribute('aria-pressed', String((accentPick || own).toLowerCase() === s[1].toLowerCase()));
    b.addEventListener('click', function () { accentPick = s[0] === 'own' ? null : s[1]; sw.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); mountIt(isStill); });
    sw.appendChild(b);
  });
  foot.insertBefore(sw, note);
  var isStill = q.has('still');
  mountIt(isStill); still.setAttribute('aria-pressed', String(isStill));
  still.addEventListener('click', function () { isStill = !isStill; still.setAttribute('aria-pressed', String(isStill)); mountIt(isStill); });
  /* the read-out: what the pointer is on, what is switched on, or what the figure says it is doing */
  function readout() {
    if (!ctx) return '';
    if (ctx.hover) return ctx.hover.name || 'something';
    if (ctx.active) return (ctx.active.name || 'something') + ' · on';
    return ctx.read || '';
  }
  var lastRead = null, inFrame = q.has('embed') && window.parent !== window;
  (function watch() {
    var h = readout();
    if (h !== lastRead) {
      lastRead = h;
      if (h) { note.textContent = ''; var b = document.createElement('b'); b.textContent = h; note.appendChild(b); } else note.textContent = 'Move the pointer over the scene.';
      if (inFrame) { try { window.parent.postMessage({ type: 'diorama', name: fig.name, hover: h }, '*'); } catch (e) {} }
    }
    requestAnimationFrame(watch);
  })();
  /* in a frame: take a theme, an accent or a still request from the parent */
  if (inFrame) {
    window.addEventListener('message', function (e) {
      var d = e.data; if (!d || d.type !== 'diorama') return;
      if (d.theme !== undefined) { themePick = d.theme || null; sel.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.theme === (themePick || figBase))); }); mountIt(isStill); }
      if (d.accent !== undefined) { accentPick = d.accent || null; sw.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.accent.toLowerCase() === (accentPick || own).toLowerCase())); }); mountIt(isStill); }
      if (d.still !== undefined) { isStill = !!d.still; still.setAttribute('aria-pressed', String(isStill)); mountIt(isStill); }
    });
    var hello = function () { try { window.parent.postMessage({ type: 'diorama', name: fig.name, ready: true, hint: fig.hint || '', hot: (ctx && ctx.parts && ctx.parts.hot ? ctx.parts.hot.map(function (g) { return g.name; }).filter(Boolean) : []) }, '*'); } catch (e) {} };
    window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'diorama' && d.hello) hello(); });
    hello();
  }
})();
</script>
